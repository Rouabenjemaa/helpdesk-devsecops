server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Phase 5 : en-têtes de sécurité (mêmes que le backend). 'unsafe-inline' pour script-src reste
  # nécessaire tant que le frontend utilise des scripts et gestionnaires onclick en ligne.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  server_tokens off;

  # Support pour application SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy vers le backend Express avec conservation des adresses IP d'audit
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
