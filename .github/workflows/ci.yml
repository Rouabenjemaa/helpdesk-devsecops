name: HelpDesk DevSecOps Pipeline

# Phase 3 : pipeline BLOQUANT. Chaque contrôle de sécurité fait échouer le pipeline
# (aucun "|| true", aucun "continue-on-error"). Tant que les 4 failles volontaires
# existent, le pipeline est ROUGE : c'est le comportement attendu (preuve de la phase 3).
on:
  push:
    branches: ["main", "dev", "feat/**"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  # JOB 1 : build + tests de non-régression (Roua)
  # Les tests rejouent les attaques des 4 failles contre l'API réelle, avec une vraie base PostgreSQL.
  tests:
    name: "Build et tests backend"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helpdesk
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: change_me_fictif_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Installer les dépendances
        working-directory: backend
        run: npm ci
      - name: Charger le schéma et les données fictives
        run: PGPASSWORD=change_me_fictif_123 psql -h localhost -U helpdesk -d helpdesk -f db/init.sql
      - name: Démarrer l'API et lancer les tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: helpdesk
          DB_USER: helpdesk
          DB_PASSWORD: change_me_fictif_123
        run: |
          # Secret de test généré à la volée : il n'existe nulle part dans le dépôt.
          export JWT_SECRET="$(openssl rand -hex 32)"
          node server.js > ../server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health > /dev/null && break
            sleep 2
          done
          STATUS=0
          TEST_BASE_URL=http://localhost:3000 TEST_METRICS_URL=http://localhost:9100 npm test || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "--- Journal du serveur (50 dernières lignes) ---"
            tail -n 50 ../server.log
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit "$STATUS"

  # JOB 2 : détection de secrets (Roua). BLOQUE sur VULN-004 (secret JWT en dur).
  # On lance le binaire Gitleaks directement : l'action gitleaks-action ne scanne que les
  # commits du push en cours (le secret, déjà présent dans l'historique, passerait inaperçu).
  gitleaks:
    name: "Gitleaks - secrets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet nécessaire
      - name: Installer Gitleaks (version fixée)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Analyse de tout l'historique Git
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # JOB 3 : analyse statique SAST (Roua). BLOQUE si une règle de sévérité ERROR est déclenchée.
  semgrep:
    name: "Semgrep - SAST"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (règles du registre + règles du projet)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --config .semgrep.yml \
            --severity ERROR \
            --error \
            --metrics=off \
            backend/

  # JOB 4 : dépendances SCA (Mahdi). BLOQUE sur CRITICAL, et sur HIGH si un correctif existe.
  trivy-deps:
    name: "Trivy - dépendances"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "backend/"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          format: "table"

  # JOB 5 : build de l'image + scan de l'image + contrôle "non root" (Mahdi)
  docker-build-scan:
    name: "Docker build et Trivy image"
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image backend
        uses: docker/build-push-action@v5
        with:
          context: backend/
          push: false
          load: true
          tags: helpdesk-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy - scan de l'image (bloque sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "helpdesk-backend:${{ github.sha }}"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          format: "table"
      - name: L'image ne doit pas tourner en root
        run: |
          USER_CFG=$(docker inspect helpdesk-backend:${{ github.sha }} --format '{{ .Config.User }}')
          echo "Utilisateur de l'image : '$USER_CFG'"
          if [ -z "$USER_CFG" ] || [ "$USER_CFG" = "root" ] || [ "$USER_CFG" = "0" ]; then
            echo "ERREUR : l'image tourne en root"
            exit 1
          fi

  # JOB 6 : publication dans GHCR, UNIQUEMENT si tous les contrôles ci-dessus ont réussi
  push-image:
    name: "Publier l'image (GHCR)"
    runs-on: ubuntu-latest
    needs: [tests, gitleaks, semgrep, trivy-deps, docker-build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules (exigé par GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/helpdesk-backend" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: backend/
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # JOB 7 : résumé lisible dans l'onglet Actions
  summary:
    name: "Résumé du pipeline"
    runs-on: ubuntu-latest
    needs: [tests, gitleaks, semgrep, trivy-deps, docker-build-scan]
    if: always()
    steps:
      - name: Résumé
        run: |
          {
            echo "## Résumé du pipeline DevSecOps"
            echo ""
            echo "| Contrôle | Résultat |"
            echo "|---|---|"
            echo "| Build et tests | ${{ needs.tests.result }} |"
            echo "| Gitleaks (secrets) | ${{ needs.gitleaks.result }} |"
            echo "| Semgrep (SAST) | ${{ needs.semgrep.result }} |"
            echo "| Trivy dépendances | ${{ needs.trivy-deps.result }} |"
            echo "| Docker build + Trivy image | ${{ needs.docker-build-scan.result }} |"
            echo ""
            echo "Branche : \`${{ github.ref_name }}\` - Commit : \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
