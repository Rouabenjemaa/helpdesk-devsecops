# =============================================================================
# HelpDesk DevSecOps - Docker Compose Local (Phase 2)
# =============================================================================
# ATTENTION : si vous avez lancé la base à la main en phase 1 (docker run), supprimez-la d'abord :
#   docker rm -f helpdesk-db
# Interface : http://localhost:8080  (nginx -> /api/ -> backend:3000 -> db:5432)
services:
  db:
    image: postgres:16-alpine
    container_name: helpdesk-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obligatoire}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obligatoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER obligatoire} -d ${POSTGRES_DB:?POSTGRES_DB obligatoire}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - helpdesk-net

  backend:
    build: ./backend
    container_name: helpdesk-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB obligatoire}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER obligatoire}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
      NODE_ENV: ${NODE_ENV:-development}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
      # nginx est devant l'API : on lit l'adresse client dans X-Forwarded-For (limitation de débit)
      TRUST_PROXY: "1"
      # Secret JWT : lu dans le fichier .env (non versionné). Pas de valeur par défaut :
      # Compose refuse de démarrer si la variable est absente.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant, voir docs/secrets-phase4.md}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk-net

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge

volumes:
  dbdata:
