# =============================================================================
# HelpDesk DevSecOps - Docker Compose Local (Phase 2)
# =============================================================================
# ATTENTION : si vous avez lancé la base à la main en phase 1 (docker run), supprimez-la d'abord :
#   docker rm -f helpdesk-db
# Interface : http://localhost:8080  (nginx -> /api/ -> backend:3000 -> db:5432)
services:
  db:
    image: postgres:16-alpine
    container_name: helpdesk-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_fictif_123}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk} -d ${POSTGRES_DB:-helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - helpdesk-net

  backend:
    build: ./backend
    container_name: helpdesk-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-helpdesk}
      DB_USER: ${POSTGRES_USER:-helpdesk}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_fictif_123}
      # Secret JWT : lu dans le fichier .env (non versionné). Pas de valeur par défaut :
      # Compose refuse de démarrer si la variable est absente.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant, voir docs/secrets-phase4.md}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk-net

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - helpdesk-net

networks:
  helpdesk-net:
    driver: bridge

volumes:
  dbdata:
