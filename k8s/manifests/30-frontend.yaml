# Interface web servie par nginx (image "unprivileged", port 8080). nginx relaie /api/ vers le Service "backend".
# L'image est construite localement puis chargée dans kind (scripts/deploy.ps1) : tag explicite, jamais "latest".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: helpdesk
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101             # utilisateur "nginx" de l'image unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: helpdesk-frontend:phase6
          imagePullPolicy: IfNotPresent     # image chargée dans kind, pas téléchargée
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: helpdesk
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - { port: 8080, targetPort: 8080, nodePort: 30080 }   # exposé sur http://localhost:8081 (kind-config.yaml)
